<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AI 토큰 사용량 대시보드</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skins/control.css">
  <script>
    // 테마를 첫 페인트 전에 정한다: ?skin= > localStorage['cud.skin'] > activity (app.js 와 같은 규칙)
    (function () {
      var s = null;
      try { s = new URLSearchParams(location.search).get('skin'); } catch (e) { s = null; }
      if (s !== 'activity' && s !== 'control') { try { s = localStorage.getItem('cud.skin'); } catch (e) { s = null; } }
      document.documentElement.setAttribute('data-skin', s === 'control' ? 'control' : 'activity');
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="top-in">
      <h1 class="brand">AI 토큰 사용량 대시보드</h1>
      <div class="top-actions">
        <div id="skinpick" class="skinpick">
          <span class="skl" aria-hidden="true">THEME</span>
          <div class="skt" role="tablist" aria-label="테마">
            <button type="button" role="tab" data-skin="activity" aria-selected="true">활동 기록</button>
            <button type="button" role="tab" data-skin="control" aria-selected="false" tabindex="-1">관제</button>
          </div>
        </div>
        <div id="provider" class="seg" role="group" aria-label="제공자 선택" hidden>
          <button type="button" data-provider="claude" aria-pressed="false">Claude</button>
          <button type="button" data-provider="codex" aria-pressed="false">GPT</button>
          <button type="button" data-provider="all" aria-pressed="true">전체</button>
        </div>
        <span id="updated" class="upd"></span>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="banner" class="banner" hidden></div>
    <div id="advisory" class="advisory" role="status" hidden></div>
    <div id="skin-control"></div>

    <div class="cols">
      <div class="col col-l">
        <section class="panel now" aria-labelledby="now-h">
          <div class="ph"><h2 id="now-h">지금</h2></div>
          <div id="now-val" class="big" aria-live="off">…</div>
          <div id="now-caption" class="cap">불러오는 중</div>
          <div id="now-vs" class="ratio"></div>
          <div id="now-bar" class="split" aria-hidden="true"></div>
          <div id="now-facts" class="kv"></div>
          <div id="now-facts2" class="kv kv2"></div>
          <details class="breakdown">
            <summary>
              <svg class="disc" width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><path d="M1.5 1 6.5 5 1.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              입력 · 출력 · 캐시 분해
            </summary>
            <div id="now-break"></div>
          </details>
        </section>

        <section class="panel" aria-labelledby="live-h">
          <div class="ph"><h2 id="live-h">작업 중</h2><span id="lcount" class="note"></span></div>
          <div id="live" class="lv"></div>
        </section>

        <section id="rate" class="panel" aria-labelledby="rate-h" hidden>
          <div class="ph"><h2 id="rate-h">GPT 사용 한도</h2><span id="plan" class="note"></span></div>
          <div id="rate-body"></div>
        </section>
      </div>

      <div class="col">
        <section class="panel" aria-labelledby="heat-h">
          <div class="ph"><h2 id="heat-h">작업 리듬 · 최근 30일</h2><span class="note">열 = 하루 · 칸 = 1시간</span></div>
          <div id="heat" role="img" aria-label="최근 일별 토큰 막대와 시간대별 사용량 히트맵"></div>
          <div id="hleg" class="hleg"></div>
        </section>

        <section class="panel" aria-labelledby="hourly-h">
          <div class="ph"><h2 id="hourly-h">최근 48시간</h2><span id="hourly-legend" class="note legend"></span></div>
          <div id="hourly-chart" class="chart hourly-chart"></div>
        </section>

        <div class="two">
          <section class="panel" aria-labelledby="share-h">
            <div class="ph"><h2 id="share-h">모델별 점유율</h2><span class="note">전체 토큰 기준</span></div>
            <div id="model-share"></div>
          </section>
          <section class="panel" aria-labelledby="cost-h">
            <div class="ph"><h2 id="cost-h">모델별 추정 비용</h2><span class="note">API 정가 기준</span></div>
            <div id="model-cost"></div>
          </section>
        </div>
      </div>

      <div class="wide">
        <section class="panel sessions" aria-labelledby="sess-h">
          <div class="ph"><h2 id="sess-h">세션 목록</h2><span id="sess-count" class="note"></span></div>
          <div class="tb">
            <label class="search">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 9.5 13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input id="q" type="search" placeholder="제목, 프로젝트, 모델, 경로 검색" autocomplete="off" aria-label="세션 검색">
            </label>
            <div id="filters" class="chips" role="group" aria-label="세션 필터">
              <button type="button" class="chip active" data-filter="all" aria-pressed="true">전체</button>
              <button type="button" class="chip" data-filter="live" aria-pressed="false">작업 중</button>
              <button type="button" class="chip" data-filter="today" aria-pressed="false">오늘</button>
              <button type="button" class="chip" data-filter="week" aria-pressed="false">7일</button>
            </div>
          </div>
          <div class="table-wrap sess-wrap">
            <table class="sess" data-table="sess">
              <thead>
                <tr>
                  <th data-sort="status" data-type="num"><button type="button"><span class="arr"></span>상태</button></th>
                  <th data-sort="title" data-type="text"><button type="button"><span class="arr"></span>제목</button></th>
                  <th data-sort="project" data-type="text"><button type="button"><span class="arr"></span>프로젝트</button></th>
                  <th data-sort="model" data-type="text"><button type="button"><span class="arr"></span>모델</button></th>
                  <th data-sort="own" data-type="num" class="num"><button type="button"><span class="arr"></span>토큰(본인)</button></th>
                  <th data-sort="agentCount" data-type="num" class="num"><button type="button"><span class="arr"></span>에이전트 수</button></th>
                  <th data-sort="agentTokens" data-type="num" class="num"><button type="button"><span class="arr"></span>에이전트 토큰</button></th>
                  <th data-sort="total" data-type="num" class="num"><button type="button"><span class="arr"></span>합계</button></th>
                  <th data-sort="cost" data-type="num" class="num c-cost"><button type="button"><span class="arr"></span>추정 비용</button></th>
                  <th data-sort="activeMs" data-type="num" class="num"><button type="button"><span class="arr"></span>작업시간</button></th>
                  <th data-sort="wallMs" data-type="num" class="num"><button type="button"><span class="arr"></span>경과</button></th>
                  <th data-sort="lastTs" data-type="num" class="num"><button type="button"><span class="arr"></span>마지막 활동</button></th>
                </tr>
              </thead>
              <tbody id="sess-body">
                <tr><td colspan="12" class="empty">불러오는 중…</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <details id="pricing" class="panel price" hidden>
          <summary>
            <svg class="disc" width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><path d="M1.5 1 6.5 5 1.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            가격표 (API 정가 기준 추정)<span class="pnote">USD / 100만 토큰</span>
          </summary>
          <div id="pricing-body" class="pbody"></div>
        </details>
      </div>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="세션 상세">
    <div class="drawer-head">
      <h2 id="drawer-title">세션 상세</h2>
      <button id="drawer-close" class="btn ghost" type="button" aria-label="닫기">닫기</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="app.js"></script>
  <script src="skins/control.js"></script>
</body>
</html>
