<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>token-dashboard thumbnail B</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #15161c 0%, #0c0d11 100%);
    color: #f5f3ee;
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    position: relative;
  }
  .topbar { position: absolute; left: 0; top: 0; width: 1280px; height: 6px;
    background: linear-gradient(90deg, #d97757 0%, #d4a72c 35%, #6a9bcc 65%, #2bb3a3 100%); }
  .head { position: absolute; left: 60px; top: 46px; }
  .kicker { font-size: 26px; font-weight: 800; color: #2bb3a3; letter-spacing: -0.5px; }
  h1 { margin-top: 10px; font-size: 84px; line-height: 1.02; font-weight: 900; letter-spacing: -3px; color: #fff; }
  h1 .hl { background: linear-gradient(90deg, #d97757, #d4a72c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 16px; width: 760px; font-size: 28px; font-weight: 700; color: #bdb8ad; }
  .hero { position: absolute; right: 60px; top: 70px; text-align: right; }
  .hero .n { font-size: 128px; font-weight: 900; letter-spacing: -5px; line-height: 0.9; color: #f0b48f; }
  .hero .l { margin-top: 6px; font-size: 26px; font-weight: 800; color: #cfcac0; }
  .shot {
    position: absolute; left: 60px; top: 330px; width: 1160px; height: 390px;
    border-radius: 16px; overflow: hidden; border: 2px solid #2c2f3a;
    box-shadow: 0 -10px 60px rgba(217,119,87,0.25), 0 20px 60px rgba(0,0,0,0.6);
    background: #0f1116;
  }
  .shot img { position: absolute; left: 0; top: 0; width: 1160px; height: auto; }
  .fade { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(12,13,17,0) 55%, rgba(12,13,17,0.95) 100%); }
  .tags { position: absolute; left: 60px; bottom: 26px; display: flex; gap: 12px; }
  .tag { font-size: 24px; font-weight: 900; padding: 10px 20px; border-radius: 999px; background: #1b1d25; border: 2px solid #2c2f3a; }
</style>
</head>
<body>
  <div class="topbar"></div>

  <div class="head">
    <div class="kicker">Claude Code · GPT 사용량 대시보드</div>
    <h1>토큰, <span class="hl">얼마나</span> 썼나?</h1>
    <div class="sub">세션·서브에이전트별 토큰과 작업 시간을 실시간으로</div>
  </div>

  <div class="hero">
    <div class="n">11.6B</div>
    <div class="l">누적 토큰 · ≈ $4,300 추정</div>
  </div>

  <div class="shot"><img src="dashboard-capture.png" alt=""><div class="fade"></div></div>

  </body>
</html>
